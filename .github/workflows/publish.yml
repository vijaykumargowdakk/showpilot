name: Publish to npm

# Runs when a GitHub release is published (gh release create vX.Y.Z). It checks that the tag matches package.json,
# runs the same checks as CI, and publishes with provenance, so the npm page links back to this exact commit.
# Uses npm trusted publishing: the package's settings on npmjs.com name this repository and this workflow file, so no
# token or secret is needed (see docs/RELEASING.md). `id-token: write` below is what lets npm verify the workflow.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      # Trusted publishing (no token) needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run ci
      # Authenticated by the trusted-publisher link on npmjs.com (this repository and this workflow file), not a token.
      - run: npm publish --provenance --access public
