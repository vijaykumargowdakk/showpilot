name: Publish to npm

# Runs when a GitHub release is published (gh release create vX.Y.Z). It checks that the tag matches package.json,
# runs the same checks as CI, and publishes with provenance, so the npm page links back to this exact commit.
# Needs a repository secret NPM_TOKEN: an npm "automation" access token (npmjs.com → Access Tokens).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
