name: Feature request
description: An idea for Showpilot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The video you're trying to make, and what's missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: A sketch of the config, the cut, or the command you have in mind (optional).
